epic:
  id: EST-2
  title: Refatoração + Evolução Mr Lion Stock
  type: brownfield
  status: InProgress
  created_by: aiox-master
  created_at: 2026-04-16
  owner: pm
  branch: feat/est-2-refactor

  context:
    project: controle-de-estoque (Mr Lion Stock)
    project_path: /Volumes/KINGSTON/vault/apps/controle-de-estoque
    base_commit: "26a9d81 feat: versão final — dashboard store-centric"
    audit: docs/analysis/audit-2026-04-16.md
    brief: docs/epics/epic-estoque-v2-brief.md

  goal: |
    Entregar um sistema claro, simples e suficiente para operação Mr Lion:
    - 1 depósito + 3 lojas físicas + 2 marketplaces
    - Produtos perecíveis (mel/café)
    - Operadores em mobile, gerentes em desktop
    - Operador novo entende o fluxo em < 10 min
    - Registrar movimentação em ≤ 3 cliques
    - Mobile funciona igual desktop (PWA)

  strategy:
    sequencing: AB-parallel
    mvp_stories: 8
    backlog_stories: 7
    target_window_weeks: 3

  success_criteria:
    - Nenhum arquivo .tsx/.ts com mais de 400 linhas (páginas) / 250 (componentes)
    - Dashboard carrega e responde "o que está acabando?" em 1 segundo
    - Lotes com validade rastreados e alertas de vencimento ativos
    - Scanner de código de barras funcionando no mobile PWA
    - Tela de análise de perdas separada e acionável

  stories:
    # ═══ MVP (Wave 1) — ordem de execução ═══
    - id: EST-2.1
      key: A5
      title: Design System mínimo (tokens + primitivos documentados)
      wave: 1
      dependency: null
      rationale: Fundação — outras refatorações consomem tokens daqui
      estimate: S
      agent_suggested: dev

    - id: EST-2.2
      key: A4
      title: Simplificar DashboardPage com hierarquia visual clara
      wave: 1
      dependency: EST-2.1
      rationale: Ganho visível rápido + demonstra novo design system
      estimate: M
      agent_suggested: dev

    - id: EST-2.3
      key: A2
      title: Decompor StockEntryPage em fluxos separados (Entrada/Saída/Ajuste/Perda/Transferência)
      wave: 1
      dependency: null
      rationale: Maior ponto de dor atual (1875 linhas) + UX benefit direto
      estimate: L
      agent_suggested: dev

    - id: EST-2.4
