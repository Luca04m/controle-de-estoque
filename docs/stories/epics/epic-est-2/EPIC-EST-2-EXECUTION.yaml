      name: Fundação + Refatoração
      stories: [EST-2.1, EST-2.2, EST-2.3, EST-2.4]
      parallelizable: [EST-2.3, EST-2.4]
      estimated_days: 8

    wave_2:
      name: Features de alto valor
      stories: [EST-2.5, EST-2.6, EST-2.7, EST-2.8]
      parallelizable: [EST-2.5, EST-2.6, EST-2.7]
      estimated_days: 10

  quality_gates:
